<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL encoder/decoder</title>
    <link rel="stylesheet" href="md5hash.css">
</head>
<body>
    <header>
    <h1> URL Converter Tool</h1>
    </header>
     <div class="container">
        <h2>URL Encoder/Decoder <br>
        <p style="font-size: 14px; color: grey; font-weight: normal;" class="subtitle">convert text for safe URL transmission</p></h2>
    <div class="input">
        <h3>Input: </h3>
        <textarea id="text" placeholder="Enter Text or URL here..." rows="5"></textarea>
    </div>
      <div class="button">
        <button id="prim2" class="primary-btn" onclick="encodeText()">Encode</button>
        <button class="secondary-btn" onclick="decodeText()">Decode</button>
        <button id="clear2" class="btn-clear" onclick="clearAll()">Clear</button>
    </div>
    <div class="output">
        <h3>Output:</h3>
        <textarea id="result" readonly rows="3" placeholder="Result will appear here..."></textarea>
    </div><br><br>
    <div class="info"> <h4>How it works</h4> <br>
    <p style="color: grey;"><b>Encode:</b>Converts special characters to URL-safe format (e.g., space → %20)</p>
<p style="color: grey;"><b>Decode:</b> Converts encoded text back to readable format.</p></div>
    </div> 
    <script>
        function encodeText() {
            var input = document.getElementById('text').value;
            if (input.trim() === '') {
                alert('please enter some text/URL to encode');
                return;
            }
            try {
                var encoded = encodeURIComponent(input);
                document.getElementById('result').value = encoded;

            }
            catch (e) {
                document.getElementById('result').value = 'error'
            }
        }
        function decodeText() {
            var input = document.getElementById('text').value;
            if(input.trim() === '') {
                alert('enter a text to decode');
                return;
            }
            try {
                var decoded = decodeURIComponent(input);
                document.getElementById('result').value = decoded;
            }
            catch (e) {
                document.getElementById('result').value = 'error'
            }
        }
        
        function clearAll() {
            document.getElementById('text').value = '';
            document.getElementById('result').value = '';
        }
    </script>
   
</body>
</html>
